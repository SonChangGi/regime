name: Deploy personal Regime dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.7.0"

      - name: Install project and release checks
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the complete regression suite
        run: python -m pytest

      - name: Build allowlisted live-derived package
        run: |
          python scripts/package_public_demo.py \
            --payload publication/live/regime-results.json \
            --comparison publication/live/v5-vs-v4-comparison.json \
            --manifest publication/live/generation-manifest.json \
            --publication-mode live-derived \
            --acknowledge-personal-noncommercial-publication \
            --output dist/public-dashboard

      - name: Verify exact release manifest and public boundary
        run: python scripts/verify_public_package.py dist/public-dashboard

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload derived-results-only Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/public-dashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Refuse a stale main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          test "$current_sha" = "$EXPECTED_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
