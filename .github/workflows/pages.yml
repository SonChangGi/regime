name: Deploy synthetic Regime demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,hmm]'

      - name: Run public-safety and dashboard contract tests
        run: |
          python -m pytest \
            tests/test_public_packaging.py \
            tests/test_public_package_verifier.py \
            tests/test_dashboard_contract.py \
            tests/test_dashboard_accessibility.py \
            tests/test_schema.py

      - name: Generate fixed-seed synthetic demo
        run: |
          regime-lab demo \
            --profile quick \
            --output build/public-demo-source/regime-results.json \
            --artifacts build/public-demo-artifacts

      - name: Build allowlisted public package
        run: |
          python scripts/package_public_demo.py \
            --payload build/public-demo-source/regime-results.json \
            --output dist/public-demo

      - name: Verify exact release manifest and public boundary
        run: python scripts/verify_public_package.py dist/public-demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload synthetic-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
