name: Deploy personal Regime dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,hmm]'

      - name: Run public-safety and dashboard contract tests
        run: |
          python -m pytest \
            tests/test_public_packaging.py \
            tests/test_public_package_verifier.py \
            tests/test_dashboard_contract.py \
            tests/test_dashboard_accessibility.py \
            tests/test_schema.py

      - name: Build allowlisted live-derived package
        run: |
          python scripts/package_public_demo.py \
            --payload publication/live/regime-results.json \
            --publication-mode live-derived \
            --acknowledge-personal-noncommercial-publication \
            --output dist/public-dashboard

      - name: Verify exact release manifest and public boundary
        run: python scripts/verify_public_package.py dist/public-dashboard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload derived-results-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-dashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Refuse a stale main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          test "$current_sha" = "$EXPECTED_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
