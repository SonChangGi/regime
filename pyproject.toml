[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-lab"
version = "0.1.0"
description = "Point-in-time weekly US equity regime research and forecasting dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private research project" }
authors = [{ name = "Son ChangGi" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=3.3,<4",
]

[project.optional-dependencies]
hmm = ["hmmlearn>=0.3.3,<0.4"]
test = ["pytest>=8.3,<9"]

[project.scripts]
regime-lab = "regime_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
